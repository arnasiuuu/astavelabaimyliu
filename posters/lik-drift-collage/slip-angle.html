<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slip Angle</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Slip Angle</h1>
            <div class="subtitle">Paired traces orbiting hidden pivots, darker where they turn hardest</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="854" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (CUSTOMIZE THIS FOR YOUR ART) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Travellers</label>
                    <div class="slider-container">
                        <input type="range" id="travellers" min="100" max="2000" step="50" value="700" oninput="updateParam('travellers', this.value)">
                        <span class="value-display" id="travellers-value">700</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Run Length</label>
                    <div class="slider-container">
                        <input type="range" id="runLength" min="100" max="1200" step="50" value="520" oninput="updateParam('runLength', this.value)">
                        <span class="value-display" id="runLength-value">520</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Pivots</label>
                    <div class="slider-container">
                        <input type="range" id="pivots" min="1" max="7" step="1" value="4" oninput="updateParam('pivots', this.value)">
                        <span class="value-display" id="pivots-value">4</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Pivot Hold</label>
                    <div class="slider-container">
                        <input type="range" id="pivotHold" min="0" max="1" step="0.05" value="0.75" oninput="updateParam('pivotHold', this.value)">
                        <span class="value-display" id="pivotHold-value">0.75</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Track Width</label>
                    <div class="slider-container">
                        <input type="range" id="trackWidth" min="2" max="40" step="1" value="14" oninput="updateParam('trackWidth', this.value)">
                        <span class="value-display" id="trackWidth-value">14</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Pressure</label>
                    <div class="slider-container">
                        <input type="range" id="pressure" min="0.02" max="0.4" step="0.01" value="0.12" oninput="updateParam('pressure', this.value)">
                        <span class="value-display" id="pressure-value">0.12</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (OPTIONAL - CUSTOMIZE OR REMOVE) -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Ground</label>
                    <div class="color-picker-container">
                        <input type="color" id="ground" value="#2b2c29" onchange="updateColor('ground', this.value)">
                        <span class="color-value" id="ground-value">#2b2c29</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Trace</label>
                    <div class="color-picker-container">
                        <input type="color" id="ink" value="#e9e4d6" onchange="updateColor('ink', this.value)">
                        <span class="color-value" id="ink-value">#e9e4d6</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="initializeSystem()">Regenerate</button>
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button" onclick="saveCanvas('slip-angle-' + params.seed, 'png')">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS - CUSTOMIZE FOR YOUR ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        // URL options for headless rendering: ?w=2480&h=3508&transparent=1&seed=854
        const query = new URLSearchParams(location.search);

        let params = {
            seed: parseInt(query.get('seed')) || 854,
            travellers: 700,
            runLength: 520,
            pivots: 4,
            pivotHold: 0.75,
            trackWidth: 14,
            pressure: 0.12,
            colorPalette: ['#2b2c29', '#e9e4d6']   // ground, trace
        };

        let defaultParams = {...params, colorPalette: [...params.colorPalette]};

        // headless overrides, e.g. &pivots=3&travellers=1100&ink=%23dcddd5
        for (const k of ['travellers', 'runLength', 'pivots', 'pivotHold', 'trackWidth', 'pressure']) {
            if (query.has(k)) params[k] = parseFloat(query.get(k));
        }
        if (query.has('ink')) params.colorPalette[1] = query.get('ink');

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS GENERATIVE ART ALGORITHM - SLIP ANGLE
        // ═══════════════════════════════════════════════════════════════════════

        let pivots = [];
        let current;            // prevailing direction between pivots
        let unit;               // all lengths scale with the canvas
        let transparentGround = query.get('transparent') === '1';

        function setup() {
            let w = parseInt(query.get('w')) || 1200;
            let h = parseInt(query.get('h')) || 1200;
            let canvas = createCanvas(w, h);
            canvas.parent('canvas-container');
            pixelDensity(1);
            noLoop();
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            unit = min(width, height) / 1200;

            // pivots sit away from the edges, each with its own orbit radius and turning sense
            pivots = [];
            for (let i = 0; i < params.pivots; i++) {
                pivots.push({
                    x: random(0.15, 0.85) * width,
                    y: random(0.15, 0.85) * height,
                    r: random(90, 260) * unit,
                    spin: random() < 0.5 ? -1 : 1
                });
            }
            current = random(TWO_PI);
            window.slipPivots = pivots.map(p => ({x: p.x / width, y: p.y / height, r: p.r / width}));   // read by the poster builder
            redraw();
        }

        // desired heading at (x, y): orbit the nearest pivots, otherwise follow the current
        function fieldAngle(x, y) {
            let vx = cos(current) * 0.35, vy = sin(current) * 0.35;
            for (const p of pivots) {
                let dx = x - p.x, dy = y - p.y;
                let d = sqrt(dx * dx + dy * dy) + 1e-6;
                let falloff = exp(-sq((d - p.r) / (p.r * 0.9)));
                let w = falloff * params.pivotHold * 2.2;
                // tangent around the pivot plus a pull back onto the orbit radius
                let tx = -dy / d * p.spin, ty = dx / d * p.spin;
                let pull = (p.r - d) / p.r * 0.6;
                vx += (tx + dx / d * pull) * w;
                vy += (ty + dy / d * pull) * w;
            }
            let n = (noise(x * 0.0016 / unit, y * 0.0016 / unit) - 0.5) * 1.6;
            return atan2(vy, vx) + n;
        }

        function draw() {
            clear();
            if (!transparentGround) background(params.colorPalette[0]);
            let ink = color(params.colorPalette[1]);
            let half = params.trackWidth * unit / 2;
            let step = 2.2 * unit;
            strokeWeight(max(1, 1.1 * unit));
            noFill();

            for (let i = 0; i < params.travellers; i++) {
                let t = new Traveller();
                let left = [], right = [], turn = [];
                for (let s = 0; s < params.runLength; s++) {
                    let dh = t.advance(step);
                    if (t.x < -50 || t.y < -50 || t.x > width + 50 || t.y > height + 50) break;
                    let nx = -sin(t.heading), ny = cos(t.heading);
                    left.push([t.x + nx * half, t.y + ny * half]);
                    right.push([t.x - nx * half, t.y - ny * half]);
                    turn.push(abs(dh));
                }
                // opacity follows turning effort, drawn in short runs so it can vary
                for (const trace of [left, right]) {
                    for (let k = 1; k < trace.length; k += 6) {
                        let effort = constrain(turn[k] / 0.05, 0, 1);
                        ink.setAlpha(255 * params.pressure * (0.25 + effort));
                        stroke(ink);
                        beginShape();
                        for (let m = k - 1; m <= min(k + 6, trace.length - 1); m++) vertex(trace[m][0], trace[m][1]);
                        endShape();
                    }
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // PARTICLE SYSTEM - TRAVELLERS WITH MOMENTUM
        // ═══════════════════════════════════════════════════════════════════════

        class Traveller {
            constructor() {
                // most start near a pivot's orbit, some anywhere on the surface
                if (pivots.length && random() < 0.7) {
                    let p = random(pivots), a = random(TWO_PI);
                    let r = p.r * random(0.6, 1.4);
                    this.x = p.x + cos(a) * r;
                    this.y = p.y + sin(a) * r;
                } else {
                    this.x = random(width);
                    this.y = random(height);
                }
                this.heading = fieldAngle(this.x, this.y);
                this.grip = random(0.05, 0.14);   // how quickly heading follows the field
            }

            advance(step) {
                let want = fieldAngle(this.x, this.y);
                let dh = atan2(sin(want - this.heading), cos(want - this.heading)) * this.grip;
                this.heading += dh;
                this.x += cos(this.heading) * step;
                this.y += sin(this.heading) * step;
                return dh;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS - CUSTOMIZE FOR YOUR PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            initializeSystem();
        }

        function updateColor(colorId, value) {
            params.colorPalette[colorId === 'ground' ? 0 : 1] = value;
            document.getElementById(colorId + '-value').textContent = value;
            redraw();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                // Reset to current seed if invalid
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};
            
            params.colorPalette = [...defaultParams.colorPalette];

            // Update UI elements
            for (const id of ['travellers', 'runLength', 'pivots', 'pivotHold', 'trackWidth', 'pressure']) {
                document.getElementById(id).value = params[id];
                document.getElementById(id + '-value').textContent = params[id];
            }

            // Reset colors
            document.getElementById('ground').value = params.colorPalette[0];
            document.getElementById('ground-value').textContent = params.colorPalette[0];
            document.getElementById('ink').value = params.colorPalette[1];
            document.getElementById('ink-value').textContent = params.colorPalette[1];
            
            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
